<!DOCTYPE html>
<html lang="en">
<head.
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAY AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="logo">
                <span>J</span>JAY AI
            </div>
            
            <button class="new-chat" id="newChat">
                + New chat
            </button>
            <div class="chat-history" id="chatHistory">
                <p class="history-title">Recent chats</p>
            </div>

            <div class="sidebar-bottom">
                <button>Settings</button>
                <button>Profile</button>
            </div>
        </aside>

        <main class="main">
            <header class="topbar">
                <div>
                    <h2>JAY AI</h2>
                    <span class="status">
                        <span class="status-dot"></span>
                        Online
                    </span>
                </div>

                <button class="menu-button">•••</button>
            </header>

            <section class="messages" id="messages">
                <div class="welcome">
                    <div class="ai-logo">J</div>
                    <h1>How can I help?</h1>
                    <p>
                        Ask JAY AI anything. Build something, learn something, or just have a conversation.
                    </p>
                </div>
            </section>

            <div class="input-area">
                <div class="input-box">
                    <button class="attach">+</button>
                    <textarea id="messageInput" placeholder="Message JAY AI..." rows="1"></textarea>
                    <button class="send" id="sendButton">↑</button>
                </div>
                <p class="disclamer">JAY AI can make mistakes. Check importantant information.</p>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
