<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JAY AI</title>
    <link rel="icon" type="image/png" href="logo.png">

    <!-- JAY AI typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <!-- Markdown rendering + code highlighting + sanitizing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="logo">
                <img src="logo.png" alt="JAY AI logo">
                <span>JAY AI</span>
            </div>

            <button class="new-chat" id="newChat">
                + New chat
            </button>

            <div class="chat-history" id="chatHistory">
                <p class="history-title">Recent chats</p>
                <div id="chatList"></div>
            </div>

            <div class="sidebar-bottom">
                <button id="settingsButton">Settings</button>
                <button id="profileButton">Profile</button>
            </div>
        </aside>

        <button class="mobile-menu-toggle" id="mobileMenuToggle">☰</button>

        <main class="main">
            <header class="topbar">
                <div>
                    <h2>JAY AI</h2>
                    <span class="status">
                        <span class="status-dot"></span>
                        Online
                    </span>
                </div>

                <div class="topbar-menu">
                    <button class="menu-button" id="menuButton" aria-label="Open menu">•••</button>
                    <div class="menu-dropdown" id="menuDropdown" hidden>
                        <button id="deleteCurrentChat" class="danger-action">Delete current chat</button>
                    </div>
                </div>
            </header>

            <section class="messages" id="messages">
                <div class="welcome">
                    <img class="ai-logo" src="logo.png" alt="JAY AI logo">
                    <h1>How can I help?</h1>
                    <p>
                        Ask JAY AI anything. Build something, learn something, or just have a conversation.
                    </p>
                </div>
            </section>

            <div class="input-area">
                <div class="input-box">
                    <input id="fileInput" type="file" hidden accept=".pdf,.docx,.txt,.md,.csv,.json,.png,.jpg,.jpeg,.webp,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/plain,text/markdown,text/csv,application/json,image/png,image/jpeg,image/webp">
                    <button class="attach" id="attachButton" type="button" aria-label="Attach a file">+</button>
                    <div class="file-chip" id="fileChip" hidden>
                        <img class="file-thumb" id="fileThumb" alt="" hidden><span class="file-icon" id="fileIcon">📎</span>
                        <div class="file-details">
                            <span class="file-name" id="fileName"></span>
                            <span class="file-size" id="fileSize"></span>
                        </div>
                        <button class="file-remove" id="fileRemove" type="button" aria-label="Remove attachment" title="Remove attachment">×</button>
                    </div>
                    <textarea id="messageInput" placeholder="Message JAY AI..." rows="1"></textarea>
                    <button class="send" id="sendButton">↑</button>
                </div>
                <p class="disclamer">JAY AI can make mistakes. Check important information.</p>
            </div>
        </main>
    </div>

    <div class="modal-backdrop" id="modalBackdrop" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <button class="modal-close" id="modalClose" aria-label="Close">×</button>
            <h2 id="modalTitle">Settings</h2>
            <div id="modalContent"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
